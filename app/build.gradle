plugins { id 'com.android.application' }

// Optional private signing configuration; never commit this file or the keystore.
def signingFile = rootProject.file('keystore.properties')
def signingProperties = new Properties()
if (signingFile.exists()) {
    signingFile.withInputStream { signingProperties.load(it) }
}

android {
    namespace 'dev.tommy.daylightpilot'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.tommy.daylightpilot'
        minSdk 30
        targetSdk 35
        versionCode 4
        versionName '0.4'
        testInstrumentationRunner 'dev.tommy.daylightpilot.LoadingPreview'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        release {
            if (signingFile.exists()) {
                storeFile rootProject.file(signingProperties['storeFile'])
                storePassword signingProperties['storePassword']
                keyAlias signingProperties['keyAlias']
                keyPassword signingProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (signingFile.exists()) signingConfig signingConfigs.release
        }
    }
}
